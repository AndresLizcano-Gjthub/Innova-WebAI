# CI mínimo: pruebas del backend y build del frontend.
# Las acciones van fijadas por SHA de commit (no por etiqueta) para evitar ataques a la cadena de suministro.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ia-innova/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ia-innova/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ia-innova/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
