<style>
body{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
/* ---------- Tokens de diseño ---------- */
:root {
  --bg: #ffffff;
  --surface: #f7f6fb;      /* gris-violeta muy claro para barra lateral */
  --border: #e4e2ee;
  --text: #1c1b22;
  --text-muted: #5f5c6e;   /* contraste AA sobre blanco */
  --accent: #6d28d9;       /* morado INNOVA */
  --accent-hover: #5b21b6;
  --accent-soft: #efe9fb;
  --danger: #b42318;
  --danger-soft: #fdecea;
  --radius: 12px;
  --sidebar-w: 280px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.55; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* ---------- Layout general ---------- */
.app { display: flex; height: 100dvh; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* ---------- Barra lateral ---------- */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0; background: var(--surface);
  border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 12px;
}
.sidebar__top { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.05rem; color: var(--accent); }
.sidebar__close { display: none; }

.new-chat {
  background: var(--accent); color: #fff; border: 0; border-radius: var(--radius);
  padding: 10px 14px; font-weight: 500; text-align: left;
}
.new-chat:hover { background: var(--accent-hover); }

.history { flex: 1; overflow-y: auto; margin: 16px 0; display: flex; flex-direction: column; gap: 2px; }
.history__item {
  background: transparent; border: 0; border-radius: 8px; padding: 9px 12px; text-align: left;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text);
}
.history__item:hover { background: var(--accent-soft); }
.history__item--active { background: var(--accent-soft); font-weight: 500; box-shadow: inset 3px 0 0 var(--accent); }

.sidebar__bottom { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 2px; }
.sidebar__link {
  background: transparent; border: 0; text-align: left; padding: 8px 12px; border-radius: 8px;
  color: var(--text-muted);
}
.sidebar__link:disabled { opacity: 0.8; }

.backdrop { display: none; }

/* ---------- Barra superior ---------- */
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
.topbar__title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-btn { display: none; }

.icon-btn {
  width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg); font-size: 1.1rem; line-height: 1; flex-shrink: 0;
}
.icon-btn:hover:not(:disabled) { background: var(--accent-soft); }
.icon-btn:disabled { color: var(--text-muted); opacity: 0.6; }

.banner { background: var(--danger-soft); color: var(--danger); padding: 10px 20px; font-size: 0.95rem; }

/* ---------- Mensajes ---------- */
.messages { flex: 1; overflow-y: auto; }
.messages__inner { max-width: 760px; margin: 0 auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 24px; }

.message { display: flex; gap: 12px; }
.message--user { justify-content: flex-end; }
.message--user .message__body {
  background: var(--accent-soft); border-radius: var(--radius); padding: 10px 16px;
  max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere;
}
.message--assistant .message__body { max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; padding-top: 4px; }
.message--error .message__body { background: var(--danger-soft); color: var(--danger); border-radius: var(--radius); padding: 10px 16px; }

.avatar { width: 34px; height: 34px; flex-shrink: 0; }

.dots { display: flex; gap: 6px; padding: 12px 0; }
.dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: 0.35; animation: pulse 1.2s infinite ease-in-out; }
.dots span:nth-child(2) { animation-delay: 0.2s; }
.dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

/* ---------- Info de respuesta ---------- */
.model-info { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; font-size: 0.85rem; color: var(--text-muted); white-space: normal; }
.model-info__reason { flex-basis: 100%; margin: 0; }
.badge { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-weight: 500; }

/* ---------- Bienvenida ---------- */
.welcome { max-width: 680px; margin: 0 auto; padding: 12vh 20px 24px; }
.welcome__logo { display: block; margin-bottom: 20px; }
.welcome h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); line-height: 1.2; font-weight: 600; margin: 0 0 12px; letter-spacing: -0.01em; }
.welcome p { color: var(--text-muted); margin: 0 0 28px; max-width: 52ch; }
.welcome__suggestions { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.suggestion {
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 16px; text-align: left;
}
.suggestion:hover { border-color: var(--accent); background: var(--accent-soft); }

/* ---------- Compositor ---------- */
.composer { max-width: 760px; width: 100%; margin: 0 auto; padding: 8px 20px 16px; }
.composer__box {
  display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--border);
  border-radius: 16px; padding: 8px; background: var(--bg);
}
.composer__box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.composer textarea {
  flex: 1; border: 0; outline: 0; resize: none; background: transparent;
  padding: 8px 4px; max-height: 200px; line-height: 1.5;
}
.send-btn { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 8px 16px; font-weight: 500; height: 36px; }
.send-btn:hover:not(:disabled) { background: var(--accent-hover); }
.send-btn:disabled { background: #cfc9df; color: #fff; }
.composer__hint { margin: 6px 4px 0; font-size: 0.8rem; color: var(--text-muted); }

/* ---------- Responsive ---------- */
@media (max-width: 800px) {
  .sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: 30; transform: translateX(-100%);
    transition: transform 0.2s ease; box-shadow: 4px 0 24px rgba(0, 0, 0, 0.12);
  }
  .sidebar--open { transform: none; }
  .sidebar__close, .menu-btn { display: inline-block; }
  .backdrop { display: block; position: fixed; inset: 0; background: rgba(28, 27, 34, 0.4); z-index: 20; }
  .composer__hint { display: none; }
  .welcome { padding-top: 6vh; }
}

@media (prefers-reduced-motion: reduce) {
  .dots span { animation: none; opacity: 0.7; }
  .sidebar { transition: none; }
}

.preview-note{background:#fff8e1;color:#5c4a00;font-size:.8rem;padding:6px 16px;border-bottom:1px solid #f0e2a8;text-align:center}
.app{height:calc(100dvh - 30px)}
</style></head><body>
<div class="preview-note">Vista previa del diseño (réplica en HTML). El proyecto real es el de Next.js del zip. Respuestas de prueba.</div>
<div class="app">

<script>
const SUG=["Explícame qué es un orquestador de modelos de IA","Ayúdame a redactar el resumen de un informe","Revisa esta función y dime si tiene errores"];
const id=()=>Date.now()+"-"+Math.random().toString(36).slice(2,8);
const mk=()=>({id:id(),title:"Nueva conversación",messages:[]});
let convs=[mk()],active=convs[0].id,loading=false;
const $=s=>document.getElementById(s);
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cur=()=>convs.find(c=>c.id===active);
function render(){
  $("history").innerHTML=convs.map(c=>`<button class="history__item${c.id===active?" history__item--active":""}" data-id="${c.id}">${esc(c.title)}</button>`).join("");
  $("title").textContent=cur().title;
  const m=cur().messages,box=$("messages");
  if(!m.length){
    box.innerHTML=`<div class="welcome"><img class="welcome__logo" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAgMTIwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IkxvZ28gV2ViIElBIElOTk9WQSI+CiAgPGcgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNkQyOEQ5IiBzdHJva2Utd2lkdGg9IjYiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCI+CiAgICA8cGF0aCBkPSJNNDYgMzcgQzQxIDI2IDM1IDIwIDI3IDE2Ii8+CiAgICA8cGF0aCBkPSJNNzQgMzcgQzc5IDI2IDg1IDIwIDkzIDE2Ii8+CiAgPC9nPgogIDxjaXJjbGUgY3g9IjI2IiBjeT0iMTUiIHI9IjciIGZpbGw9IiM2RDI4RDkiLz4KICA8Y2lyY2xlIGN4PSI5NCIgY3k9IjE1IiByPSI3IiBmaWxsPSIjNkQyOEQ5Ii8+CiAgPGVsbGlwc2UgY3g9IjYwIiBjeT0iNzIiIHJ4PSI0NCIgcnk9IjM4IiBmaWxsPSIjNkQyOEQ5Ii8+CiAgPHJlY3QgeD0iNDIiIHk9IjYxIiB3aWR0aD0iMTAiIGhlaWdodD0iMTkiIHJ4PSI1IiBmaWxsPSIjZmZmIi8+CiAgPHJlY3QgeD0iNjgiIHk9IjYxIiB3aWR0aD0iMTAiIGhlaWdodD0iMTkiIHJ4PSI1IiBmaWxsPSIjZmZmIi8+Cjwvc3ZnPgo=" alt="Logo de Web IA INNOVA" width="72" height="72"><h1>Una sola interfaz, el modelo adecuado para cada tarea.</h1><p>Escribe tu pregunta. Web IA INNOVA la envía al orquestador del proyecto.</p><div class="welcome__suggestions">${SUG.map(s=>`<button class="suggestion">${s}</button>`).join("")}</div></div>`;
  } else {
    box.innerHTML=`<div class="messages__inner">${m.map(x=>x.role==="user"
      ?`<div class="message message--user"><div class="message__body">${esc(x.text)}</div></div>`
      :`<div class="message message--assistant"><img class="avatar" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAgMTIwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IkxvZ28gV2ViIElBIElOTk9WQSI+CiAgPGcgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNkQyOEQ5IiBzdHJva2Utd2lkdGg9IjYiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCI+CiAgICA8cGF0aCBkPSJNNDYgMzcgQzQxIDI2IDM1IDIwIDI3IDE2Ii8+CiAgICA8cGF0aCBkPSJNNzQgMzcgQzc5IDI2IDg1IDIwIDkzIDE2Ii8+CiAgPC9nPgogIDxjaXJjbGUgY3g9IjI2IiBjeT0iMTUiIHI9IjciIGZpbGw9IiM2RDI4RDkiLz4KICA8Y2lyY2xlIGN4PSI5NCIgY3k9IjE1IiByPSI3IiBmaWxsPSIjNkQyOEQ5Ii8+CiAgPGVsbGlwc2UgY3g9IjYwIiBjeT0iNzIiIHJ4PSI0NCIgcnk9IjM4IiBmaWxsPSIjNkQyOEQ5Ii8+CiAgPHJlY3QgeD0iNDIiIHk9IjYxIiB3aWR0aD0iMTAiIGhlaWdodD0iMTkiIHJ4PSI1IiBmaWxsPSIjZmZmIi8+CiAgPHJlY3QgeD0iNjgiIHk9IjYxIiB3aWR0aD0iMTAiIGhlaWdodD0iMTkiIHJ4PSI1IiBmaWxsPSIjZmZmIi8+Cjwvc3ZnPgo=" alt=""><div class="message__body">${esc(x.text)}<div class="model-info"><span class="badge">Datos de prueba</span></div></div></div>`).join("")}
      ${loading?`<div class="message message--assistant" role="status"><img class="avatar" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAgMTIwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IkxvZ28gV2ViIElBIElOTk9WQSI+CiAgPGcgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjNkQyOEQ5IiBzdHJva2Utd2lkdGg9IjYiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCI+CiAgICA8cGF0aCBkPSJNNDYgMzcgQzQxIDI2IDM1IDIwIDI3IDE2Ii8+CiAgICA8cGF0aCBkPSJNNzQgMzcgQzc5IDI2IDg1IDIwIDkzIDE2Ii8+CiAgPC9nPgogIDxjaXJjbGUgY3g9IjI2IiBjeT0iMTUiIHI9IjciIGZpbGw9IiM2RDI4RDkiLz4KICA8Y2lyY2xlIGN4PSI5NCIgY3k9IjE1IiByPSI3IiBmaWxsPSIjNkQyOEQ5Ii8+CiAgPGVsbGlwc2UgY3g9IjYwIiBjeT0iNzIiIHJ4PSI0NCIgcnk9IjM4IiBmaWxsPSIjNkQyOEQ5Ii8+CiAgPHJlY3QgeD0iNDIiIHk9IjYxIiB3aWR0aD0iMTAiIGhlaWdodD0iMTkiIHJ4PSI1IiBmaWxsPSIjZmZmIi8+CiAgPHJlY3QgeD0iNjgiIHk9IjYxIiB3aWR0aD0iMTAiIGhlaWdodD0iMTkiIHJ4PSI1IiBmaWxsPSIjZmZmIi8+Cjwvc3ZnPgo=" alt=""><div class="message__body"><div class="dots"><span></span><span></span><span></span></div></div></div>`:""}</div>`;
    box.scrollTop=box.scrollHeight;
  }
  upd();
}
function upd(){$("send").disabled=loading||!$("input").value.trim()||!navigator.onLine}
function send(t){
  t=(t||"").trim(); if(!t||loading) return;
  const c=cur(); if(!c.messages.length) c.title=t.length>40?t.slice(0,40)+"…":t;
  c.messages.push({role:"user",text:t}); loading=true; $("input").value=""; grow(); render();
  setTimeout(()=>{c.messages.push({role:"ai",text:"Esta es una respuesta de prueba. Recibí tu mensaje: «"+t+"». Cuando el orquestador esté conectado, aquí aparecerá la respuesta real."});loading=false;render()},1200);
}
function grow(){const e=$("input");e.style.height="auto";e.style.height=e.scrollHeight+"px"}
function sb(o){$("sidebar").classList.toggle("sidebar--open",o);$("backdrop").style.display=o&&innerWidth<=800?"block":"none"}
$("input").addEventListener("input",()=>{grow();upd()});
$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send($("input").value)}});
$("send").onclick=()=>send($("input").value);
$("newChat").onclick=()=>{if(cur().messages.length){const c=mk();convs.unshift(c);active=c.id}sb(false);render()};
$("history").onclick=e=>{const b=e.target.closest("[data-id]");if(b){active=b.dataset.id;sb(false);render()}};
$("messages").onclick=e=>{const b=e.target.closest(".suggestion");if(b)send(b.textContent)};
$("openSb").onclick=()=>sb(true);$("closeSb").onclick=()=>sb(false);$("backdrop").onclick=()=>sb(false);
addEventListener("online",()=>{$("offline").hidden=true;upd()});addEventListener("offline",()=>{$("offline").hidden=false;upd()});
render();
</script></body></html>
